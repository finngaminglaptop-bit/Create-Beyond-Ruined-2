			# Lower bound of the randomized cooldown between raids sent out by a Proto-Hivemind.
			# Default 12000 (10 min).
			# Default: 12000
			# Range: > 20
			protoRaidCooldownMinTicks = 12000
			# Upper bound of the randomized cooldown between raids sent out by a Proto-Hivemind.
			# Default 54000 (45 min). Should be >= protoRaidCooldownMinTicks.
			# Default: 54000
			# Range: > 20
			protoRaidCooldownMaxTicks = 54000
			# Radius (blocks) a Proto-Hivemind searches for raid targets - structures or players.
			# Default 300.
			# Default: 300
			# Range: > 0
			protoRaidSearchRadius = 300

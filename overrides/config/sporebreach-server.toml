		[mobs.proto.structures]
			# How often (in ticks) a Proto-Hivemind is checked for starting a new structure
			# growth job. Default 6000 (5 min).
			# Default: 6000
			# Range: > 20
			recheckIntervalTicks = 6000
			# How often (in ticks) an in-progress structure growth job is advanced by one
			# building pass. Default 100 (5s).
			# Default: 100
			# Range: > 20
			passIntervalTicks = 100
			# Minimum Proto-Hivemind age before it can start growing structures. Default 1.

			# Range: > 1
			maxPerProto = 5
			# Minimum distance (blocks) between a Proto-Hivemind's 2nd+ grown structure and its
			# earlier ones. The first structure is always centered on the Proto-Hivemind itself.
			# Default 64.
			# Default: 64
			# Range: > 0
			minDistance = 64
			# Biomass spent per building pass, the same resource base Spore's own Proto-Hivemind
			# shell growth spends. A pass is skipped if biomass is too low. Default 8.
			# Default: 8
			# Range: > 0
			biomassCostPerPass = 8
			# Max blocks placed per building pass. Default 200.
			# Default: 200
			# Range: > 1
			blocksPerPass = 200
			# Structures a Proto-Hivemind may grow around itself. verticalOffset shifts the structure's
			# anchor up (positive) or down (negative) from ground/Proto-Hivemind level; omit it to default to 0.
			# Format: "structureId|weight" or "structureId|weight|verticalOffset".
			structurePool = ["sporebreach:proto_spire_hollow|40|-45", "sporebreach:proto_spire_hollow_alt|40|-45", "sporebreach:proto_spire_apex|20|-30", "sporebreach:proto_spire_needle|20|-30", "sporebreach:proto_spire_shelf|20|-60"]
			# Chance an underground structure grows beneath a completed surface structure.
			# Always guaranteed for a Proto-Hivemind's first structure regardless of this chance.
			# Default 0.5.
			# Default: 0.5
			# Range: 0.0 ~ 1.0
			undergroundChance = 0.5
			# Underground structures a Proto-Hivemind may grow beneath a surface structure. Skipped
			# if it wouldn't clear undergroundNaturalGroundCoverage (see [mobs.structures]).
			# Format: "structureId|weight".
			undergroundPool = ["sporebreach:underground_pillar_large|25", "sporebreach:underground_column|20"]

		[mobs.proto.outposts]
			# Whether Proto-Hiveminds seed new Mound outposts at a distance from themselves
			# to extend the infected area. Default true.
			enabled = true
			# Minimum Proto-Hivemind age before it starts rolling to seed outposts. Default 2.
			# Default: 2
			# Range: > 0
			minAge = 2
			# Minimum ticks between outpost-seeding rolls from the same Proto-Hivemind.
			# Default 12000 (10 min).
			# Default: 12000
			# Range: > 20
			cooldownTicks = 12000
			# Minimum distance (blocks) from a Proto-Hivemind that a new outpost may be seeded.
			# Default 96.
			# Default: 96
			# Range: > 0
			minDistance = 96
			# Maximum distance (blocks) from a Proto-Hivemind that a new outpost may be seeded.
			# Should be >= minDistance. Default 128.
			# Default: 128
			# Range: > 0
			maxDistance = 128
			# Radius (blocks) around a candidate outpost site checked for existing Mounds
			# before seeding a new one. Default 32.
			# Default: 32
			# Range: > 0
			moundCheckRadius = 32
			# Max Mounds allowed within moundCheckRadius of a candidate site before seeding
			# there is skipped for this roll. Default 1.
			# Default: 1
			# Range: > 0
			moundLimit = 1

	[mobs.calamity]
		# Master toggle for the global Calamity cap. Default true.
		calamityCapEnabled = true
		# Max Calamities allowed to exist at once, across every dimension. New Calamities beyond
		# this cull whichever existing one is furthest from any player. Default 8.
		# Default: 8
		# Range: > 0
		calamityCap = 8

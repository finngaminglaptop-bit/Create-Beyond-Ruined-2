		# Maximum 'age counter' for Proto-Hiveminds. Default 20.
		# Default: 4
		# Range: > 0
		protoMaxAge = 4
		# Ticks between Proto-Hivemind age-ups. Default 18000 (15 min)
		# Default: 18000
		# Range: > 20
		protoAgeUpIntervalTicks = 18000

